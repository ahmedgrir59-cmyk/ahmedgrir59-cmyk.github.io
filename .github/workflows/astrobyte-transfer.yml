name: Transfer ASTROBYTE assets to GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/astrobyte-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and check ASTROBYTE deployment assets
        env:
          FILE_MANIFEST: ''
        run: |
          python3 - <<'PY'
          import os, json, gzip, base64, hashlib, urllib.request, urllib.parse, pathlib, time
          manifest = json.loads(gzip.decompress(base64.b64decode(os.environ['FILE_MANIFEST'])))
          sources = ['https://wispy-recipe-0c1e.ahmedgrir59.workers.dev', 'https://deft-cactus-9b498b.netlify.app']
          checks = {
              'index.html':'c614f6d8814dbc9146325b38c64645b4ca9c54ed53e0c85a39def1aa548f95b5',
              'assets/index-C0e2g9cC.js':'09498af6d69873c364e4bcecb865032fc674eb21183f3351061c54f3f61aafd6',
              'models/nasa_perseverance.glb':'10db7c03a5e63a5a3b3e7baa6243aa4918ba045fa8ff0a731d0217491adc727f',
          }
          failed=[]
          for n,(path,size) in enumerate(manifest.items(),1):
              if path.startswith('/') or '..' in pathlib.PurePosixPath(path).parts:
                  raise ValueError('Unsafe file path: '+path)
              good=False
              for src in sources:
                  try:
                      url=src+'/'+urllib.parse.quote(path,safe='/')
                      req=urllib.request.Request(url,headers={'User-Agent':'ASTROBYTE-deployment-transfer/1.0'})
                      with urllib.request.urlopen(req,timeout=25) as res:
                          blob=res.read()
                      if len(blob)!=size: raise ValueError('Expected '+str(size)+' bytes, got '+str(len(blob)))
                      if path in checks and hashlib.sha256(blob).hexdigest()!=checks[path]:
                          raise ValueError('File checksum mismatch')
                      destination=pathlib.Path(path)
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      destination.write_bytes(blob)
                      print(str(n)+'/'+str(len(manifest))+' '+path+' ('+str(size)+' bytes) from '+src)
                      good=True
                      break
                  except Exception as e:
                      print('Could not get '+path+' from '+src+': '+str(e))
              if not good: failed.append(path)
          if failed:
              print('FAILED files: '+', '.join(failed))
              raise SystemExit('Transfer incomplete; no commit will be pushed')
          pathlib.Path('.nojekyll').touch()
          pathlib.Path('404.html').write_bytes(pathlib.Path('index.html').read_bytes())
          print('Verified '+str(len(manifest))+' files')
          PY
      - name: Publish files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Publish ASTROBYTE static site"
            git push
          fi
